name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/

  eval:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # The corpus is fetched from sba.gov and ecfr.gov on every run otherwise.
      # eCFR started answering 200 with a short challenge page after repeated
      # requests from the runner, which failed the build. Caching keyed on the
      # manifest means a given set of source URLs is fetched once; editing the
      # manifest changes the key and re-downloads.
      - name: Cache the downloaded corpus
        uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('ingestion/manifest.py') }}
      - name: Download corpus and build the vector store
        run: |
          python -m ingestion.download_corpus
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO, format='%(name)s %(levelname)s %(message)s')
          from ingestion.orchestrator import run_ingestion
          run_ingestion()
          "
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      # eval/conftest.py appends the tracked-metric table to $GITHUB_STEP_SUMMARY,
      # so the scores render on the run page instead of only in the step log.
      - name: Run golden set evaluation
        run: pytest eval/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
